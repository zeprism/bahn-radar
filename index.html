<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeMaster</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
:root{--ink:#eef2ff;--mut:#b9c2e6;--g:rgba(255,255,255,.12);--b:rgba(255,255,255,.28);--ac:#7cf0d0;--bad:#ff9aa8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 "Nunito","Segoe UI",system-ui,sans-serif;background:linear-gradient(135deg,#1b1464,#5b2a86 50%,#0f6e8c) fixed}
body:before,body:after{content:"";position:fixed;width:42vmax;height:42vmax;border-radius:50%;filter:blur(70px);z-index:-1}
body:before{background:#ff6bb5;opacity:.45;top:-12vmax;left:-8vmax}
body:after{background:#3ee0c0;opacity:.35;bottom:-14vmax;right:-8vmax}
.glass{background:var(--g);border:1px solid var(--b);border-radius:22px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 8px 32px rgba(10,5,50,.35),inset 0 1px 0 rgba(255,255,255,.3);padding:18px}
header{display:flex;gap:16px;align-items:center;margin:14px;padding:12px 18px}
header b{font-size:20px;white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px}
nav button{flex:none;width:34px;height:34px;border-radius:50%;padding:0}
nav .on{background:var(--ac);color:#0b2a3a;border-color:var(--ac)}
nav .ok{border-color:var(--ac)}
nav .lock{opacity:.4}
main{display:grid;gap:14px;margin:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"t v" "e p"}
#task{grid-area:t}#edwrap{grid-area:e}.pv{grid-area:v;padding:8px}#pw{grid-area:p}
h2{margin:0 0 6px;font-size:22px}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;background:rgba(255,255,255,.18);font-size:13px;margin-bottom:8px}
p{margin:6px 0;color:var(--mut)}
button{font:inherit;color:var(--ink);background:rgba(255,255,255,.16);border:1px solid var(--b);border-radius:12px;padding:8px 16px;cursor:pointer}
button:hover{background:rgba(255,255,255,.26)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#ck,.go{background:var(--ac);color:#0b2a3a;border-color:var(--ac);font-weight:700}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
textarea{width:100%;height:170px;resize:vertical;background:rgba(10,8,40,.45);color:#fff;border:1px solid var(--b);border-radius:14px;padding:12px;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;tab-size:4}
#fr{width:100%;height:100%;min-height:300px;border:0;border-radius:16px;background:#fff}
pre{margin:0;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;overflow:auto;max-height:240px;color:var(--mut)}
pre i{display:block;font-style:normal}
pre .new{background:rgba(124,240,208,.22);color:#fff;border-left:3px solid var(--ac);padding-left:8px;margin-left:-11px}
#fb{min-height:24px;margin:8px 0 0}.good{color:var(--ac)}.bad{color:var(--bad)}
@media(max-width:860px){main{grid-template-columns:1fr;grid-template-areas:"t" "e" "v" "p"}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style></head><body>
<header class="glass"><b>CodeMaster</b><nav id="nav"></nav></header>
<main>
<section class="glass" id="task"></section>
<section class="glass pv"><iframe id="fr" title="Результат"></iframe></section>
<section class="glass" id="edwrap"><textarea id="ed" spellcheck="false" aria-label="Код Python"></textarea>
<div class="row"><button id="hb">Подсказка</button><button id="ck">Проверить</button></div><p id="fb" role="status"></p></section>
<section class="glass" id="pw"><pre id="proj"></pre></section>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const has=(e,k)=>e.some(x=>x[0]==k),cnt=(e,k)=>e.filter(x=>x[0]==k).length,txt=(e,r)=>e.some(x=>x[0]=="p"&&r.test(x[1]));
// Формат урока: k = 0 учимся, 1 с подсказкой, 2 без подсказок. s = стартовый код, c = проверка(код, элементы страницы)
const LS=[
{n:"Первая страница",done:"Твоя первая страница готова!",T:[
{k:0,h:"Заголовок",d:"Функция title() ставит заголовок страницы. Текст пишется в кавычках. Поменяй его на своё имя.",s:'title("Привет, мир!")',c:(c,e)=>has(e,"h1")},
{k:1,h:"Текст",d:"Функция text() добавляет абзац. Замени ___ на пару слов о себе в кавычках.",hint:'text("Я учу Python")',s:"text(___)",c:(c,e)=>has(e,"p")},
{k:1,h:"Цвет фона",d:"color() меняет фон страницы. Название цвета пишется по-английски.",hint:'color("lightblue")',s:"color(___)",c:(c,e)=>has(e,"bg")},
{k:2,h:"Сам: второй абзац",d:"Добавь ещё один text() про своё хобби.",s:"",c:(c,e)=>cnt(e,"p")>=2},
{k:2,h:"Сам: кнопка и новый фон",d:"Добавь button() с любым текстом и смени фон на другой цвет.",s:"",c:(c,e)=>has(e,"btn")&&cnt(e,"bg")>=2}]},
{n:"Переменные",done:"Визитка с переменными готова!",T:[
{k:0,h:"Переменная",d:"Переменная — коробка с именем, в ней лежит значение. Поменяй имя.",s:'name = "Аня"\ntitle(name)',c:(c,e)=>/name\s*=/.test(c)&&has(e,"h1")},
{k:1,h:"Число",d:"Число пишется без кавычек. str() превращает его в текст, чтобы склеить знаком +.",hint:'age = 12\ntext("Мне " + str(age) + " лет")',s:'age = ___\ntext("Мне " + str(age) + " лет")',c:(c,e)=>/age\s*=\s*\d+/.test(c)&&txt(e,/Мне \d+ лет/)},
{k:1,h:"f-строка",d:"Строка с буквой f перед кавычками вставляет переменную в фигурных скобках.",hint:'hobby = "шахматы"\ntext(f"Я люблю {hobby}")',s:'hobby = ___\ntext(f"Я люблю {hobby}")',c:(c,e)=>/hobby\s*=\s*["']/.test(c)&&/\{hobby\}/.test(c)&&has(e,"p")},
{k:2,h:"Сам: город",d:"Создай переменную city и покажи её через f-строку в text().",s:"",c:(c,e)=>/city\s*=/.test(c)&&/f["'][^"']*\{city\}/.test(c)&&has(e,"p")},
{k:2,h:"Сам: очки",d:"Создай score = 0, потом увеличь его на 10 (можно score = score + 10 или score += 10) и покажи число на странице. Число можно передать прямо: text(score), или с текстом: text(f\"Очки: {score}\").",s:"",c:(c,e)=>/score\s*=\s*0/.test(c)&&/score\s*(=\s*score\s*\+|\+=)\s*10/.test(c)&&txt(e,/10/)}]}];
const SOON=["Условия if","Else и elif","Цикл for","Цикл while","Списки","Работа со списками","Словари","Функции","Параметры","return","Строки","Методы строк","Ввод input","Случайные числа","Модули","Ошибки try","Классы","Методы классов","Наследование","Мини-игра: логика","Мини-игра: очки","Мини-игра: уровни","Финал: готовая игра"];
const NAMES=[...LS.map(l=>l.n),...SOON];
const PRE='_p=[]\ndef title(t):_p.append(["h1",str(t)])\ndef text(t):_p.append(["p",str(t)])\ndef color(c):_p.append(["bg",str(c)])\ndef button(t):_p.append(["btn",str(t)])\n';
let S={l:0,t:0,proj:"",max:0},py;
try{S=Object.assign(S,JSON.parse(localStorage.getItem("cm")))}catch(e){}
const save=()=>{try{localStorage.setItem("cm",JSON.stringify(S))}catch(e){}};
async function run(proj,code){const ns=py.toPy({});let err=null,els=[];
 try{py.runPython(PRE,{globals:ns});py.runPython(proj,{globals:ns});py.runPython(code,{globals:ns})}catch(e){err=e.message.trim().split("\n").pop()}
 try{els=JSON.parse(py.runPython("import json;json.dumps(_p)",{globals:ns}))}catch(e){}
 ns.destroy();return{els,err}}
function frame(els){let bg="#fff",h="";for(const[k,v]of els){if(k=="bg")bg=v.replace(/[^#\w(),.% -]/g,"");else if(k=="h1")h+=`<h1>${esc(v)}</h1>`;else if(k=="p")h+=`<p>${esc(v)}</p>`;else h+=`<button>${esc(v)}</button>`}
 return`<style>body{margin:0;padding:28px;font-family:system-ui,sans-serif;background:${bg};color:#1a1a2e}h1{margin:0 0 12px}button{font:inherit;padding:10px 20px;border-radius:10px;border:0;background:#5b2a86;color:#fff;margin-top:8px}</style>${h||"<p style='opacity:.5'>Здесь появится твоя страница</p>"}`}
async function upd(){if(!py)return;const code=$("#ed").value,r=await run(S.proj,code);$("#fr").srcdoc=frame(r.els);
 const a=S.proj?S.proj.split("\n").map(l=>`<i>${esc(l)||" "}</i>`).join(""):"",b=code.trim()?code.split("\n").map(l=>`<i class="new">${esc(l)||" "}</i>`).join(""):"";
 $("#proj").innerHTML=a+b||"<i>Код проекта появится здесь</i>"}
function nav(){$("#nav").innerHTML=NAMES.map((n,i)=>`<button title="${i+1}. ${n}" class="${i==S.l?"on":i<S.max?"ok":i>=LS.length?"lock":""}" data-i="${i}">${i+1}</button>`).join("");
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i<LS.length&&i<=S.max){S={...S,l:i,t:0,proj:""};save();view()}})}
function view(){nav();const L=LS[S.l],T=L.T[S.t],done=S.t>=L.T.length;$("#fb").textContent="";
 $("#edwrap").style.display=done?"none":"";
 if(done){const nx=S.l+1<LS.length;$("#task").innerHTML=`<span class="tag">Урок ${S.l+1} пройден</span><h2>${L.done}</h2><p>Справа готовый результат и весь код, который ты написал.</p>${nx?'<button class="go" id="nx">Следующий урок</button>':"<p>Уроки 3–25 скоро появятся.</p>"}`;
  if(nx)$("#nx").onclick=()=>{S={...S,l:S.l+1,t:0,proj:"",max:Math.max(S.max,S.l+1)};save();view()};
  S.max=Math.max(S.max,S.l+1);save();nav();run(S.proj,"").then(r=>{$("#fr").srcdoc=frame(r.els)});$("#proj").innerHTML=S.proj.split("\n").map(l=>`<i class="new">${esc(l)||" "}</i>`).join("");return}
 $("#task").innerHTML=`<span class="tag">Урок ${S.l+1} · задание ${S.t+1} из 5 · ${["Учимся","С подсказкой","Без подсказок"][T.k]}</span><h2>${T.h}</h2><p>${T.d}</p><p id="ht" class="good"></p>`;
 $("#hb").style.display=T.k==1?"":"none";$("#ed").value=T.s;upd()}
$("#hb").onclick=()=>{$("#ht").textContent="Подсказка: "+LS[S.l].T[S.t].hint.replace(/\n/g," | ")};
let tm;$("#ed").oninput=()=>{clearTimeout(tm);tm=setTimeout(upd,300)};
$("#ed").onkeydown=e=>{if(e.key=="Tab"){e.preventDefault();document.execCommand("insertText",false,"    ")}};
$("#ck").onclick=async()=>{if(!py)return;const code=$("#ed").value,T=LS[S.l].T[S.t],r=await run(S.proj,code);let m;
 if(/___/.test(code))m="Замени ___ на своё значение.";else if(r.err)m=/concatenate|must be str/.test(r.err)?"Нельзя склеить текст и число знаком +. Оберни число в str(...) или используй f-строку: f\"Очки: {score}\".":"Ошибка: "+r.err;else if(!T.c(code,r.els))m="Пока не то. Перечитай задание.";
 if(m){$("#fb").className="bad";$("#fb").textContent=m;return}
 S.proj+=(S.proj?"\n":"")+code.trim();S.t++;save();view();$("#fb").className="good";$("#fb").textContent="Верно!"};
view();$("#fb").textContent="Загружаю Python…";
loadPyodide().then(p=>{py=p;$("#fb").textContent="";upd()}).catch(()=>{$("#fb").className="bad";$("#fb").textContent="Не удалось загрузить Python. Проверь интернет."});
</script></body></html>
